server.port=8080
# Listen on all network interfaces so a phone/tablet on the same Wi-Fi can connect
server.address=0.0.0.0

# SQLite database file (created automatically in the "data" folder)
spring.datasource.url=jdbc:sqlite:data/ticketing.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite is a single file, so one connection is the safest setting
spring.datasource.hikari.maximum-pool-size=1

# Create the tables on startup (schema.sql only creates what is missing)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Folder for the database, backups, and the auto-generated key file
ticketing.data-dir=data
# 32-byte AES key encoded as Base64. Leave the environment variable unset to
# let the app generate data/secret.key on first start (fine for development).
ticketing.encryption-key=${TICKETING_ENCRYPTION_KEY:}
